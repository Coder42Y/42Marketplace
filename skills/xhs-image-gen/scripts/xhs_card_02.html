<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1080px;
    height: 1440px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: #FAF7F2;
    color: #1C1917;
  }
  .container {
    height: 100%;
    display: flex;
    flex-direction: column;
    padding: 80px 90px 70px;
  }
  .top-label {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #CC4B24;
    margin-bottom: 48px;
  }
  .title {
    font-family: Georgia, serif;
    font-size: 64px;
    font-weight: 700;
    color: #1C1917;
    line-height: 1.2;
    margin-bottom: 60px;
  }
  .title em { font-style: italic; color: #CC4B24; }
  .concept-row {
    display: flex;
    flex-direction: column;
    gap: 28px;
    flex: 1;
  }
  .concept-item {
    display: flex;
    align-items: center;
    gap: 28px;
  }
  .concept-badge {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: #CC4B24;
    color: #FFFFFF;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 700;
    flex-shrink: 0;
    letter-spacing: 1px;
  }
  .concept-info {
    flex: 1;
  }
  .concept-name {
    font-size: 38px;
    font-weight: 700;
    color: #1C1917;
    margin-bottom: 8px;
  }
  .concept-desc {
    font-size: 28px;
    color: #57534E;
    line-height: 1.5;
  }
  .arrow-row {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 20px 0;
    color: #CC4B24;
    font-size: 32px;
    font-weight: 700;
  }
  .pill-row {
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-top: 8px;
  }
  .pill {
    font-size: 26px;
    color: #78716C;
    border: 1px solid #E7DDD0;
    border-radius: 56px;
    padding: 10px 28px;
    background: #FFFFFF;
  }
  .bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding-top: 40px;
    border-top: 1px solid #E7DDD0;
  }
  .progress { font-size: 26px; color: #A8A29E; letter-spacing: 3px; font-weight: 500; }
  .swipe-hint { font-size: 26px; color: #A8A29E; }
</style>
</head>
<body>
  <div class="container">
    <div class="top-label">Core Concepts</div>
    <div class="title">理解 Tmux<br>从<em>这三个概念</em>开始</div>
    <div class="concept-row">
      <div class="concept-item">
        <div class="concept-badge">S<br>E<br>S</div>
        <div class="concept-info">
          <div class="concept-name">Session · 会话</div>
          <div class="concept-desc">一个完整的工作环境，可以 detach（挂起）</div>
        </div>
      </div>
      <div class="arrow-row">↓</div>
      <div class="concept-item">
        <div class="concept-badge">W<br>I<br>N</div>
        <div class="concept-info">
          <div class="concept-name">Window · 窗口</div>
          <div class="concept-desc">一个会话里的多个终端标签页</div>
        </div>
      </div>
      <div class="arrow-row">↓</div>
      <div class="concept-item">
        <div class="concept-badge">P<br>A<br>N</div>
        <div class="concept-info">
          <div class="concept-name">Pane · 面板</div>
          <div class="concept-desc">一个窗口里的多个分屏面板</div>
        </div>
      </div>
    </div>
    <div class="pill-row">
      <span class="pill">#Terminal</span>
      <span class="pill">#Linux</span>
      <span class="pill">#效率工具</span>
    </div>
    <div class="bottom">
      <div class="progress">02 / 05</div>
      <div class="swipe-hint">左滑查看全部 →</div>
    </div>
  </div>
</body>
</html>
